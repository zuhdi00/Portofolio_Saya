<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERD Master Data Karyawan — PT Supracor Sejahtera</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #fdf2f8 0%, #eff6ff 35%, #ecfdf5 70%, #fffbeb 100%);
    color: #1f2937;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    color: #111827;
    text-align: center;
  }
  p.subtitle {
    text-align: center;
    margin: 0 0 20px;
    color: #374151;
    font-size: 14px;
  }
  #erd {
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 16px;
    overflow-x: auto;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
  }
  #erd svg { display: block; margin: 0 auto; }
  #erd svg.erDiagram .divider path { stroke-opacity: 0.35; }
  #erd svg.erDiagram .row-rect-odd path,
  #erd svg.erDiagram .row-rect-odd rect,
  #erd svg.erDiagram .row-rect-even path,
  #erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
  #erd svg text { fill: #1f2937 !important; }
</style>
</head>
<body>
<h1>ERD Master Data Karyawan</h1>
<p class="subtitle">HRIS PT Supracor Sejahtera — Fase 2: Database &amp; Auth</p>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Segoe UI", system-ui, sans-serif',
  themeVariables: {
    darkMode: false,
    fontSize: '13px',
    fontFamily: '"Segoe UI", system-ui, sans-serif',
    lineColor: '#4b5563',
    textColor: '#1f2937',
    nodeTextColor: '#1f2937',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  DEPARTEMEN ||--o{ KARYAWAN : memiliki
  JABATAN ||--o{ KARYAWAN : menempati
  KARYAWAN ||--o| USERS : "akun login"
  KARYAWAN ||--o{ KONTRAK_KERJA : punya
  KARYAWAN ||--o{ PENDIDIKAN : punya
  KARYAWAN ||--o{ KELUARGA : punya
  KARYAWAN ||--o{ DOKUMEN_KARYAWAN : punya
  KARYAWAN |o--o{ KARYAWAN : "atasan langsung"
  DEPARTEMEN {
    uuid id PK
    string kode
    string nama
  }
  JABATAN {
    uuid id PK
    string nama
    int level
  }
  KARYAWAN {
    uuid id PK
    string nik "NIK perusahaan, unik"
    string no_ktp
    string nama_lengkap
    string email
    string no_hp
    date tgl_lahir
    string tempat_lahir
    enum jenis_kelamin
    string agama
    enum status_nikah "TK-K3 utk PTKP"
    text alamat
    date tgl_masuk
    enum status_karyawan "tetap-kontrak-harian"
    string npwp
    string no_bpjs_tk
    string no_bpjs_kes
    string no_rekening
    string nama_bank
    uuid departemen_id FK
    uuid jabatan_id FK
    uuid atasan_id FK
    boolean is_aktif
  }
  USERS {
    uuid id PK
    uuid karyawan_id FK
    string username
    string password_hash
    enum role "admin-hr-atasan-karyawan"
    timestamp last_login
  }
  KONTRAK_KERJA {
    uuid id PK
    uuid karyawan_id FK
    enum jenis "PKWT-PKWTT"
    date tgl_mulai
    date tgl_selesai
    string file_path
  }
  PENDIDIKAN {
    uuid id PK
    uuid karyawan_id FK
    enum jenjang
    string institusi
    string jurusan
    int tahun_lulus
  }
  KELUARGA {
    uuid id PK
    uuid karyawan_id FK
    string nama
    enum hubungan
    string no_hp
    boolean is_kontak_darurat
  }
  DOKUMEN_KARYAWAN {
    uuid id PK
    uuid karyawan_id FK
    enum jenis "KTP-ijazah-sertifikat"
    string file_path
    date tgl_upload
  }`);
document.getElementById('erd').innerHTML = svg;

const palette = {
  KARYAWAN:         { header: '#FDE047', odd: '#FEFCE8', even: '#FEF9C3', border: '#A16207' },
  DEPARTEMEN:       { header: '#93C5FD', odd: '#EFF6FF', even: '#DBEAFE', border: '#1D4ED8' },
  JABATAN:          { header: '#C4B5FD', odd: '#F5F3FF', even: '#EDE9FE', border: '#6D28D9' },
  USERS:            { header: '#F9A8D4', odd: '#FDF2F8', even: '#FCE7F3', border: '#BE185D' },
  KONTRAK_KERJA:    { header: '#6EE7B7', odd: '#ECFDF5', even: '#D1FAE5', border: '#047857' },
  PENDIDIKAN:       { header: '#FDBA74', odd: '#FFF7ED', even: '#FFEDD5', border: '#C2410C' },
  KELUARGA:         { header: '#A5B4FC', odd: '#EEF2FF', even: '#E0E7FF', border: '#4338CA' },
  DOKUMEN_KARYAWAN: { header: '#5EEAD4', odd: '#F0FDFA', even: '#CCFBF1', border: '#0F766E' },
};

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const name = Object.keys(palette).find(n => node.id.includes('-' + n + '-') || node.id.endsWith('-' + n));
  const colors = name ? palette[name] : { header: '#E5E7EB', odd: '#FFFFFF', even: '#F3F4F6', border: '#6B7280' };

  const firstPath = node.querySelector('path[d]');
  if (firstPath) {
    const d = firstPath.getAttribute('d');
    const nums = d.match(/-?[\d.]+/g)?.map(Number);
    if (nums && nums.length >= 8) {
      const xs = [nums[0], nums[2], nums[4], nums[6]];
      const ys = [nums[1], nums[3], nums[5], nums[7]];
      const x = Math.min(...xs), y = Math.min(...ys);
      const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x); rect.setAttribute('y', y);
      rect.setAttribute('width', w); rect.setAttribute('height', h);
      rect.setAttribute('rx', '10');
      rect.setAttribute('fill', colors.header);
      rect.setAttribute('stroke', colors.border);
      rect.setAttribute('stroke-width', '1.5');
      firstPath.replaceWith(rect);
    }
  }

  node.querySelectorAll('.row-rect-odd path, .row-rect-odd rect').forEach(el => {
    el.setAttribute('fill', colors.odd);
    el.setAttribute('stroke', 'none');
  });
  node.querySelectorAll('.row-rect-even path, .row-rect-even rect').forEach(el => {
    el.setAttribute('fill', colors.even);
    el.setAttribute('stroke', 'none');
  });
  node.querySelectorAll('text').forEach(t => t.setAttribute('fill', '#1f2937'));
});

document.querySelectorAll('#erd svg.erDiagram text').forEach(t => {
  t.setAttribute('fill', '#1f2937');
  t.style.fill = '#1f2937';
});
</script>
</body>
</html>
