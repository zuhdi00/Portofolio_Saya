<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard Supracor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* 1. VARIABEL CSS UNTUK TEMA (THEMING) */
        :root {
            --bg-body: #f4f7f9;
            --bg-card: #ffffff;
            --color-text-primary: #1f2937;
            --color-text-secondary: #6b7280;
            --color-accent: #3b82f6;
            --color-accent-hover: #1d4ed8;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            --theme-transition: 0.5s ease;
        }

        .dark-mode {
            --bg-body: #111827;
            --bg-card: #1f2937;
            --color-text-primary: #f3f4f6;
            --color-text-secondary: #9ca3af;
            --color-accent: #22c55e;
            --color-accent-hover: #16a34a;
            --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.5);
        }

        .blue-gradation-mode {
            --bg-body: linear-gradient(180deg, #89f7fe 0%, #66a6ff 100%);
            --bg-card: #f0f9ff;
            --color-text-primary: #0f172a;
            --color-text-secondary: #334155;
            --color-accent: #06b6d4;
            --color-accent-hover: #0891b2;
            --shadow-card: 0 10px 20px -5px rgba(30, 58, 138, 0.3);
        }

        /* 2. BASE STYLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color var(--theme-transition), color var(--theme-transition), box-shadow var(--theme-transition);
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #89f7fe, #66a6ff, #f4f7f9, #3b82f6);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        /* 3. Login Screen Styles */
        .login-box {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow-card);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            height: 60px;
            margin-bottom: 20px;
        }

        .login-box h2 {
            margin-bottom: 10px;
            color: var(--color-text-primary);
        }

        .login-box p {
            margin-bottom: 30px;
            color: var(--color-text-secondary);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-secondary);
        }

        #role-input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: var(--bg-body);
            color: var(--color-text-primary);
            font-size: 1rem;
        }

        #login-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background-color: var(--color-accent);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        #login-button:hover {
            background-color: var(--color-accent-hover);
            transform: translateY(-2px);
        }

        .login-error {
            color: #ef4444;
            margin-top: 15px;
            height: 20px;
            font-size: 0.9rem;
        }

        /* Animasi Shake untuk Error */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <img src="assets/Logo_SPS-removebg-preview.png" alt="Logo" class="login-logo">
        <h2>Selamat Datang</h2>
        <p>Silakan masukkan peran Anda untuk mengakses dashboard.</p>
        <div class="input-group">
            <i class="fas fa-user-shield"></i>
            <input type="text" id="role-input" placeholder="Contoh: admin, production, guest">
        </div>
        <button id="login-button">Login</button>
        <p id="login-error" class="login-error"></p>
    </div>

    <script>
        const loginButton = document.getElementById('login-button');
        const roleInput = document.getElementById('role-input');
        const loginError = document.getElementById('login-error');

        // FUNGSI LOGIN
        function handleLogin() {
            const role = roleInput.value.trim().toLowerCase();
            const validRoles = ['admin', 'production', 'guest'];

            loginError.textContent = '';
            roleInput.classList.remove('shake');

            if (role && validRoles.includes(role)) {
                // Simpan peran di localStorage
                localStorage.setItem('currentUserRole', role);
                // Set flag agar dashboard tahu ini login baru
                sessionStorage.setItem('justLoggedIn', '1');
                // Arahkan ke halaman dashboard utama
                window.location.href = 'index.html';
            } else {
                loginError.textContent = 'Peran tidak valid. Coba: admin, production, atau guest.';
                roleInput.classList.add('shake');
            }
        }

        // FUNGSI INISIALISASI
        document.addEventListener('DOMContentLoaded', () => {
            // Terapkan tema yang tersimpan dari dashboard jika ada
            const savedTheme = localStorage.getItem('dashboardTheme') || 'light-mode';
            document.body.className = savedTheme;

            // Setup event listener untuk login
            loginButton.addEventListener('click', handleLogin);
            roleInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    handleLogin();
                }
            });

            // Jika pengguna sudah login dan mencoba akses login.html, arahkan kembali ke index.html
            const loggedInRole = localStorage.getItem('currentUserRole');
            if (loggedInRole) {
                const validRoles = ['admin', 'production', 'guest'];
                if (validRoles.includes(loggedInRole)) {
                    window.location.href = 'index.html';
                }
            }
        });
    </script>

</body>

</html>
