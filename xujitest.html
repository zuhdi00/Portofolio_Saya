  <script>
    let currentOp = "";

 function formatDate(dateString) {
  if (!dateString || dateString === '-' || dateString === '0000-00-00') return '-';

  // Cek apakah formatnya DD-MM-YYYY
  const parts = dateString.split('-');
  if (parts.length === 3) {
    const [dayStr, monthStr, yearStr] = parts;
    const day = parseInt(dayStr, 10);
    const month = parseInt(monthStr, 10);
    const year = parseInt(yearStr, 10);

    if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
      const monthNames = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const monthName = monthNames[month - 1];
      return `${day} ${monthName} ${year}`;
    }
  }

  // fallback jika format tak sesuai
  return '-';
}
function fetchData() {
  let op = document.getElementById("inputOP").value.trim();
  if (!op) {
    alert("Silakan masukkan nomor O.P");
    return;
  }
  if (!op.startsWith("SPS/")) {
    op = "SPS/" + op;
  }

  axios.get(`proxy.php?barcode=${encodeURIComponent(op)}`)
    .then(response => {
      console.log("📦 Full response:", response.data); // log semua response

      if (response.data.success) {
        const d = response.data.data;
        console.log("✅ Data diterima dari API:", d);

        // cek field satu per satu
        const fields = [
          "cNoOp", "cnm_brg", "cNoMc", "cnm_c",
          "nPanjang", "nLebar", "nTinggi",
          "nQtyStok", "cpr_ikat", "dTglkirim"
        ];
        fields.forEach(f => {
          if (d[f] === undefined || d[f] === null || d[f] === "") {
            console.warn(`⚠️ Field '${f}' kosong atau undefined`);
          } else {
            console.log(`✔️ ${f}:`, d[f]);
          }
        });

        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        const todayFormattedForParser = `${dd}-${mm}-${yyyy}`;
        const formattedToday = formatDate(todayFormattedForParser);

        currentOp = d.cNoOp;

        document.getElementById("tanggalCetak").textContent = formattedToday;
        document.getElementById("tglKirim").textContent = formatDate(d.dTglkirim);
        document.getElementById("op").textContent = d.cNoOp || "-";
        document.getElementById("pemesan").textContent = d.cnm_c || "-";
        document.getElementById("namaBarang").textContent = d.cnm_brg || "-";
        document.getElementById("kodeBarang").textContent = d.cNoMc || "-";
        document.getElementById("ukuran").textContent =
          (d.nPanjang && d.nLebar && d.nTinggi) ?
          `${parseInt(d.nPanjang)} x ${parseInt(d.nLebar)} x ${parseInt(d.nTinggi)}` : "-";

/* Tambahan untuk Ukuran Corr */
document.getElementById("ukuranCorr").textContent =
  (d.nbrutto_usl && d.nbrutto_usp) ?
  `${parseInt(d.nbrutto_usl)} x ${parseInt(d.nbrutto_usp)}` : "-";


        const qtyElement = document.getElementById("qty");
        qtyElement.innerHTML = (parseInt(d.nQtyStok) || 0).toLocaleString('id-ID') + '<span class="unit"> pcs</span>';

        //document.getElementById("qtyKG").innerHTML = '0<span class="unit"> pcs</span>';

        const qtyElement_ikat = document.getElementById("ikat");
        //qtyElement_ikat.innerHTML = (parseInt(d.cpr_ikat) || 0) + '<span class="unit"> pcs/ikat</span>';

        // Reset manual input fields
        document.getElementById("manualPalet").value = '';
        document.getElementById("manualKoli").value = '';
        document.getElementById("manualShift").value = '';

        document.getElementById("kualitas").textContent =
          [d.ckd_b1, d.ckd_b2, d.ckd_b3, d.ckd_b4, d.ckd_b5].filter(Boolean).join(' / ') || "-";
        document.getElementById("flute").textContent = d.cJnsGel || "-";

        document.getElementById("reportContainer").style.display = "block";
        generateQRCode(d.cNoOp);

        // Tambahkan ini untuk menampilkan cFlexo di sebelah kanan QR code
        document.getElementById("flexoLabel").textContent = d.cFlexo ? d.cFlexo : "";
      } else {
        alert(response.data.message);
      }
    })
    .catch(error => {
      console.error("❌ Error axios:", error);
      alert("Gagal mengambil data: " + error);
    });
}

    function saveAndPrint() {
      const pallet = document.getElementById("manualPalet").value.trim() || "0";
      const koli = document.getElementById("manualKoli").value.trim() || "0";
      const shift = document.getElementById("manualShift").value.trim();
      const lokasiBarang = document.getElementById("lokasiBarangInput").value.trim();
      const ikat = parseInt(document.getElementById("ikat").textContent) || 0;

      if (!currentOp) {
        alert("Data O.P belum dimuat");
        return;
      }
      // Hanya shift yang tetap wajib diisi
      if (!shift) {
        alert("Masukkan nama kepala shift");
        return;
      }

      // Kirim "0" jika kosong, agar backend tidak error
      axios.post('https://supracor.co.id/proxy.php', {
        op: currentOp,
        pallet: pallet,
        koli: koli,
        clengkap1: shift // shift tetap dikirim
        // lokasiBarang tidak dikirim ke server
      })
      .then(response => {
        if (response.data.success) {
          const totalPcs = (parseInt(pallet) || 0) * (parseInt(koli) || 0) * ikat;
          if(document.getElementById("qtyKG")) {
            document.getElementById("qtyKG").innerHTML = totalPcs + '<span class="unit"> pcs</span>';
          }
          window.print();
        } else {
          alert("Gagal menyimpan data: " + response.data.message);
        }
      })
      .catch(error => {
        alert("Terjadi kesalahan saat menyimpan: " + error);
      });
    }
