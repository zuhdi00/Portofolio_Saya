<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Cari Master Design</title>
<style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    input { padding: 8px; width: 300px; }
    img { margin-top: 20px; max-width: 80%; height: auto; border: 1px solid #ccc; }
</style>
</head>
<body>
    <h2>Pencarian File Master Design</h2>
    <input type="text" id="search" placeholder="Masukkan nama file tanpa ekstensi">
    <button onclick="searchImage()">Cari</button>
    <div id="result"></div>

<script>
function searchImage() {
    let filename = document.getElementById("search").value.trim();
    if (filename === "") return alert("Masukkan nama file!");

    // Asumsi server sudah di-mount di /masterdesign/
    let imgPath = `/masterdesign/${filename}.jpg`;

    fetch(imgPath)
        .then(res => {
            if (!res.ok) throw new Error("File tidak ditemukan");
            document.getElementById("result").innerHTML = `<img src="${imgPath}" alt="Master Design">`;
        })
        .catch(() => {
            document.getElementById("result").innerHTML = `<p style="color:red;">File tidak ditemukan</p>`;
        });
}
</script>
</body>
</html>
