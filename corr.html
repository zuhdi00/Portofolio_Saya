<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Report Produksi</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f9; }
    h2 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { border: 1px solid #ddd; padding: 6px; text-align: center; font-size: 14px; }
    th { background: #007bff; color: white; }
    .chart-container { margin-top: 30px; background: white; padding: 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>📊 Dashboard Report Produksi</h2>
  <table id="dataTable"></table>
  <div class="chart-container">
    <canvas id="myChart"></canvas>
  </div>

<script>
async function loadData() {
  const res = await fetch("read_report.php");
  const data = await res.json();

  if (data.error) {
    document.getElementById("dataTable").innerHTML = "<tr><td>" + data.error + "</td></tr>";
    return;
  }

  const headers = ["Seq#", "Customer#", "Flu", "DB", "1M", "1L", "2M", "2L", "Width", "Length", "Cuts", "Good"];
  let html = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";
  data.forEach(r => {
    html += `<tr>
      <td>${r.seq}</td>
      <td>${r.customer}</td>
      <td>${r.flu}</td>
      <td>${r.db}</td>
      <td>${r.c1m}</td>
      <td>${r.c1l}</td>
      <td>${r.c2m}</td>
      <td>${r.c2l}</td>
      <td>${r.width}</td>
      <td>${r.length}</td>
      <td>${r.cuts}</td>
      <td>${r.good}</td>
    </tr>`;
  });
  document.getElementById("dataTable").innerHTML = html;

  const summary = {};
  data.forEach(r => {
    summary[r.customer] = (summary[r.customer] || 0) + (parseInt(r.good) || 0);
  });
  const labels = Object.keys(summary);
  const values = Object.values(summary);


  new Chart(document.getElementById("myChart"), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Total Good',
        data: values,
        backgroundColor: 'rgba(54,162,235,0.6)'
      }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true } } }
  });
}

loadData();
</script>
</body>
</html>
