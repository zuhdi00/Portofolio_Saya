<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Schema Explorer</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
  .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
  h1 { color: #333; margin-bottom: 20px; }
  .controls { margin-bottom: 20px; }
  button { padding: 10px 20px; margin-right: 10px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
  button:hover { background: #0056b3; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
  th { background: #e9ecef; font-weight: bold; }
  tr:hover { background: #f8f9fa; }
  .error { color: red; padding: 10px; background: #ffebee; border-radius: 4px; margin-top: 10px; }
  .success { color: green; padding: 10px; background: #e8f5e9; border-radius: 4px; margin-top: 10px; }
  .loading { color: #666; font-style: italic; }
</style>
</head>
<body>

<div class="container">
  <h1>🔍 Database Schema Explorer</h1>
  
  <div class="controls">
    <h3>Pilih Tabel:</h3>
    <button onclick="getSchema('tbStbBJ')">📊 tbStbBJ (STB)</button>
    <button onclick="getSchema('tbHslCorrDtl')">✓ tbHslCorrDtl (Hasil Corr)</button>
    <button onclick="getSchema('tbCorrDtl')">📝 tbCorrDtl (Plan Corr)</button>
    <br><br>
    <button onclick="getSample(selectedTable)">📋 Lihat Sample Data (10 rows)</button>
    <button onclick="clearResults()">🗑️ Clear</button>
  </div>

  <div id="result"></div>
</div>

<script>
let selectedTable = null;

async function getSchema(table) {
  selectedTable = table;
  const result = document.getElementById('result');
  result.innerHTML = '<p class="loading">⏳ Mengambil schema...</p>';
  
  try {
    const response = await fetch(`api_schema_info.php?table=${table}&mode=schema`);
    const data = await response.json();
    
    if (!data.success) {
      result.innerHTML = `<p class="error">❌ Error: ${data.message}</p>`;
      return;
    }
    
    let html = `<h2>📋 Tabel: ${data.table}</h2>`;
    html += '<table>';
    html += '<tr><th>Column Name</th><th>Data Type</th><th>Max Length</th></tr>';
    
    data.columns.forEach(col => {
      html += `<tr>
        <td><strong>${col.COLUMN_NAME}</strong></td>
        <td>${col.DATA_TYPE}</td>
        <td>${col.CHARACTER_MAXIMUM_LENGTH || '-'}</td>
      </tr>`;
    });
    
    html += '</table>';
    html += `<p class="success">✅ Total ${data.columns.length} kolom ditemukan</p>`;
    html += `<p style="color: #666; font-size: 0.9em; margin-top: 10px;">
      Catatan: Untuk field KG/Tonase, cari field yang mengandung nama: nKg, nTonase, nTotal, nNetto, nWeight, dll
    </p>`;
    
    result.innerHTML = html;
  } catch (e) {
    result.innerHTML = `<p class="error">❌ Network Error: ${e.message}</p>`;
  }
}

async function getSample(table) {
  if (!table) {
    alert('Pilih tabel terlebih dahulu');
    return;
  }
  
  const result = document.getElementById('result');
  result.innerHTML = '<p class="loading">⏳ Mengambil sample data...</p>';
  
  try {
    const response = await fetch(`api_schema_info.php?table=${table}&mode=sample`);
    const data = await response.json();
    
    if (!data.success) {
      result.innerHTML = `<p class="error">❌ Error: ${data.message}</p>`;
      return;
    }
    
    if (data.sampleData.length === 0) {
      result.innerHTML = `<p class="error">❌ Tidak ada data dalam tabel</p>`;
      return;
    }
    
    let html = `<h2>📋 Sample Data: ${data.table}</h2>`;
    html += `<p>Menampilkan ${data.sampleData.length} baris pertama</p>`;
    html += '<table style="font-size: 0.9em;">';
    
    // Header
    const firstRow = data.sampleData[0];
    html += '<tr>';
    Object.keys(firstRow).forEach(key => {
      html += `<th>${key}</th>`;
    });
    html += '</tr>';
    
    // Data rows
    data.sampleData.forEach(row => {
      html += '<tr>';
      Object.values(row).forEach(val => {
        const displayVal = val === null ? '<em style="color:#999">NULL</em>' : String(val).substring(0, 50);
        html += `<td>${displayVal}</td>`;
      });
      html += '</tr>';
    });
    
    html += '</table>';
    result.innerHTML = html;
  } catch (e) {
    result.innerHTML = `<p class="error">❌ Network Error: ${e.message}</p>`;
  }
}

function clearResults() {
  document.getElementById('result').innerHTML = '';
  selectedTable = null;
}
</script>

</body>
</html>
