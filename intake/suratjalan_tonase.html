<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tonase Surat Jalan</title>
  <style>
    body{font-family:Segoe UI,Roboto,Arial;margin:18px;background:#f4f6f8;color:#222}
    .card{background:#fff;padding:16px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);max-width:1100px;margin:0 auto}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    label{font-size:0.85rem;color:#555}
    input[type=date],input[type=text],select{padding:8px;border:1px solid #cfcfcf;border-radius:6px}
    button{padding:10px 14px;border-radius:6px;border:none;background:#1e88e5;color:#fff;cursor:pointer}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:8px;border:1px solid #e0e0e0;text-align:left}
    th{background:#f0f0f0}
    .muted{color:#666;font-size:0.9rem}
  </style>
</head>
<body>
  <div class="card">
    <h2>Tonase Surat Jalan — Logika VB (SF% & nPanjang)</h2>
    <p class="muted">Tarik data tonase seperti acuan frmMain / VB. Pastikan konfigurasi DB di <code>suratjalan_tonase.php</code>.</p>

    <div class="row" style="margin:10px 0 6px">
      <label>From</label>
      <input type="date" id="date_from">
      <label>To</label>
      <input type="date" id="date_to">
      <label>SRJ No</label>
      <input type="text" id="srj_no" placeholder="opsional">
      <label>OP No</label>
      <input type="text" id="op_no" placeholder="opsional">
      <label>Group</label>
      <select id="group_by">
        <option value="op">Per OP</option>
        <option value="srj">Per SRJ</option>
      </select>
      <label>Limit</label>
      <input type="text" id="limit" value="1000" style="width:80px">
      <button id="btnFetch">Fetch</button>
      <button id="btnExport" style="background:#2e7d32;margin-left:6px">Export CSV</button>
    </div>

    <div id="info" class="muted" style="margin-top:6px"></div>

    <table id="tbl">
      <thead>
        <tr><th>No</th><th>SRJ</th><th>OP</th><th>Tanggal</th><th>Tonase (kg)</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const API = 'suratjalan_tonase.php';
    const $ = id => document.getElementById(id);
    function fmt(n){return (Number(n)||0).toLocaleString('id-ID')}

    async function fetchData(){
      const date_from = $('date_from').value;
      const date_to   = $('date_to').value;
      const srj_no    = $('srj_no').value.trim();
      const op_no     = $('op_no').value.trim();
      const group_by  = $('group_by').value;
      const limit     = $('limit').value || '1000';

      const qs = new URLSearchParams({date_from,date_to,srj_no,op_no,group_by,limit});
      $('info').textContent = 'Memuat...';
      try{
        const res = await fetch(API+'?'+qs.toString());
        const json = await res.json();
        renderTable(json.data||[]);
        $('info').textContent = `Ditemukan ${json.count||0} baris. (Query time: ${json.timestamp||''})`;
      }catch(err){
        console.error(err);
        $('info').textContent = 'Gagal memuat data: '+(err.message||err);
      }
    }

    function renderTable(rows){
      const tb = document.querySelector('#tbl tbody');
      tb.innerHTML = '';
      rows.forEach((r,i)=>{
        const tr = document.createElement('tr');
        const op = r.op_no || '-';
        const srj = r.srj_no || '-';
        const tgl = r.tgl_srj || '';
        const ton = (r.tonase_kg!==undefined)?Number(r.tonase_kg).toFixed(3):'0.000';
        tr.innerHTML = `<td>${i+1}</td><td>${srj}</td><td>${op}</td><td>${tgl}</td><td style="text-align:right">${fmt(ton)}</td>`;
        tb.appendChild(tr);
      });
    }

    $('btnFetch').addEventListener('click', fetchData);

    // Simple CSV export
    $('btnExport').addEventListener('click',()=>{
      const rows = Array.from(document.querySelectorAll('#tbl tbody tr'));
      if(!rows.length) return alert('Tidak ada data');
      const csv = [['No','SRJ','OP','Tanggal','Tonase(kg)']]
      rows.forEach(tr=>{
        const cells=Array.from(tr.children).map(td=>td.textContent.trim());
        csv.push(cells);
      });
      const csvStr = csv.map(r=>r.map(c=>'"'+c.replace(/"/g,'""')+'"').join(',')).join('\n');
      const blob = new Blob([csvStr],{type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='tonase_suratjalan.csv'; a.click(); URL.revokeObjectURL(url);
    });

    // Set default dates to last 7 days
    (function setDefaults(){
      const d2 = new Date();
      const d1 = new Date(); d1.setDate(d2.getDate()-7);
      $('date_from').value = d1.toISOString().slice(0,10);
      $('date_to').value   = d2.toISOString().slice(0,10);
    })();
  </script>
</body>
</html>
