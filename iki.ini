                <li><strong>Klik tombol "Copy Konten"</strong> pada slide yang dipilih</li>
                <li><strong>Buka Microsoft PowerPoint</strong> dan buat slide baru</li>
                <li><strong>Paste (Ctrl+V)</strong> konten yang sudah dicopy ke slide PowerPoint</li>
                <li><strong>Format dan sesuaikan</strong> layout, warna, dan font sesuai kebutuhan</li>
                <li><strong>Ulangi</strong> untuk setiap slide</li>
