        <div class="tips">
            <h3>💡 Tips PowerPoint:</h3>
            <ul>
                <li><strong>Layout Slide 1 (Cover):</strong> Gunakan layout "Title Slide" dengan background gradient</li>
                <li><strong>Layout Slide 2-7:</strong> Gunakan layout "Title and Content" atau "Two Content"</li>
                <li><strong>Font:</strong> Gunakan Arial atau Calibri, ukuran 18-24 untuk body text, 32-44 untuk judul</li>
                <li><strong>Warna:</strong> Gunakan skema warna biru (#667eea), hijau (#4caf50), merah (#f44336) untuk highlight</li>
                <li><strong>Icon:</strong> Tambahkan icon dari Insert > Icons untuk visual yang lebih menarik</li>
                <li><strong>Animasi:</strong> Gunakan animasi "Fade" atau "Wipe" untuk transisi antar slide</li>
            </ul>
