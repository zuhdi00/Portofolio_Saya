    <script>
        function showSlide(slideNum) {
            // Hide all slides
            for (let i = 1; i <= 8; i++) {
                document.getElementById('slide' + i).style.display = 'none';
            }
            
            // Remove active class from all buttons
            const buttons = document.querySelectorAll('.slide-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Show selected slide
            document.getElementById('slide' + slideNum).style.display = 'block';
            
            // Add active class to selected button
            buttons[slideNum - 1].classList.add('active');
            
            // Scroll to content
            document.getElementById('slide' + slideNum).scrollIntoView({ behavior: 'smooth' });
        }

        function copySlide(slideNum) {
            const content = document.querySelector('#slide' + slideNum + ' .slide-content').textContent;
            
            // Copy to clipboard
            navigator.clipboard.writeText(content).then(() => {
                const btn = document.querySelector('#slide' + slideNum + ' .copy-btn');
                const originalText = btn.textContent;
                btn.textContent = '✅ Berhasil di-Copy!';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('Gagal copy. Silakan copy manual dengan select text dan Ctrl+C');
            });
        }

        // Initialize - show first slide
        showSlide(1);
    </script>
