<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Konten PowerPoint</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .instructions {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 6px solid #2196F3;
        }

        .instructions h2 {
            color: #1565C0;
            margin-bottom: 15px;
        }

        .instructions ol {
            padding-left: 25px;
        }

        .instructions li {
            margin: 10px 0;
            line-height: 1.6;
        }

        .slide-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .slide-btn {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .slide-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .slide-btn.active {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
        }

        .content-box {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            position: relative;
        }

        .content-box h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .content-box h3 {
            color: #333;
            margin: 20px 0 10px 0;
            font-size: 1.3em;
        }

        .slide-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin: 15px 0;
            white-space: pre-wrap;
            font-family: 'Arial', sans-serif;
            line-height: 1.8;
            font-size: 1.05em;
        }

        .copy-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 25px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .copy-btn.copied {
            background: #2196F3;
        }

        .tips {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            padding: 20px;
            border-radius: 10px;
            border-left: 6px solid #ff9800;
            margin-top: 20px;
        }

        .tips h3 {
            color: #e65100;
            margin-bottom: 10px;
        }

        .flowchart-box {
            background: #263238;
            color: #4caf50;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            margin: 15px 0;
        }

        .download-section {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
            border-left: 6px solid #4caf50;
        }

        .download-section h2 {
            color: #2e7d32;
            margin-bottom: 20px;
        }

        .big-btn {
            display: inline-block;
            padding: 20px 50px;
            margin: 10px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2em;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .big-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .slide-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
