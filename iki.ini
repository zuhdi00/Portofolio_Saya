            <div class="slide-content">📝 PEMBUATAN TSC AWAL
────────────────────────────────────

✓ Input semua data yang dibutuhkan di form TSC
✓ Terdapat Combobox Tanggal Kirim dan Combobox Tanggal Kirim Baru
✓ Pilih tanggal kirim sesuai kebutuhan
✓ Simpan dan posting TSC


⚠️ PERUBAHAN TANGGAL KIRIM TSC
────────────────────────────────────

Jika perlu mengubah tanggal kirim setelah posting:

1. Marketing Internal mengajukan BATAL POSTING
   dengan Memo Reschedule

2. Tunggu approval batal posting

3. Ubah tanggal di Combobox Tanggal Kirim Baru

4. Simpan dan posting ulang TSC


💡 HAL PENTING:
• Perubahan tanggal kirim di TSC akan mempengaruhi SC dan OP
• Pastikan koordinasi dengan tim SC dan OP
• Dokumentasikan setiap perubahan dengan memo reschedule</div>
