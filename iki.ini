✓ Verifikasi dan lengkapi data produksi


⚡ UPDATE TANGGAL DI OP - MANUAL!
────────────────────────────────────

⚠️ PERHATIAN: OP TIDAK OTOMATIS TERSINKRONISASI!

Ketika ada perubahan tanggal di TSC/SC:

1. OP TIDAK otomatis berubah

2. Identifikasi OP yang perlu diupdate

3. Buka form OP yang terkait

4. UBAH TANGGAL SECARA MANUAL
   di Combobox Tanggal Kirim Baru

5. Simpan perubahan

6. Informasikan ke tim produksi


💡 CRITICAL POINTS:
• OP WAJIB diupdate secara manual
• Risiko: Jika tidak diupdate, produksi mengacu tanggal lama
• Buat checklist perubahan tanggal
• Double check sebelum memulai produksi</div>
