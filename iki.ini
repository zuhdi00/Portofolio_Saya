            <div class="slide-content">✅ PEMBUATAN SC (SLC)
────────────────────────────────────

✓ Buat SC dengan memasukkan Nomor TSC
✓ Data TSC akan otomatis muncul di form SC
✓ Verifikasi data yang muncul
✓ Simpan dan posting SC


🔄 SINKRONISASI DENGAN PERUBAHAN TSC
────────────────────────────────────

Jika ada perubahan tanggal di TSC:

1. Ajukan BATAL POSTING SC ke Finance
   (Sertakan memo reschedule TSC)

2. Tunggu approval dari Finance

3. Setelah dibatal posting:
   • Buka form SC yang sudah dibatal
   • Input ulang Nomor TSC
   • Data akan otomatis update sesuai perubahan di TSC

4. Verifikasi semua data yang terupdate

5. Simpan dan posting ulang SC


💡 KEUNTUNGAN SISTEM:
• Data SC otomatis sinkron dengan TSC
• Tidak perlu input manual satu per satu
• Mengurangi risiko kesalahan input</div>
