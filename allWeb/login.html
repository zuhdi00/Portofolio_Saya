<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard Supracor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/Logo_SPS-removebg-preview.png">
</head>

<body class="dark-mode login-page">

    <div class="login-box">
        <img src="assets/Logo_SPS-removebg-preview.png" alt="Logo" class="login-logo">
        <h2>Selamat Datang</h2>
        <p>Silakan masukkan peran Anda untuk mengakses dashboard.</p>
        <div class="input-group">
            <i class="fas fa-user-shield"></i>
            <input type="text" id="role-input" placeholder="Username">
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password-input" placeholder="Password">
        </div>
        <button id="login-button">Login</button>
        <p id="login-error" class="login-error"></p>
    </div>

    <script src="login.js"></script>

</body>

</html>
