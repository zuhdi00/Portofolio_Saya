<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard PJS - Pencarian & Filter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root{
            --accent-1: #667eea;
            --accent-2: #764ba2;
            --muted: #6c757d;
            --glass-bg: rgba(255,255,255,0.72);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            min-height: 100vh;
            padding: 28px;
            margin: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url('../Background.png');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            color: #222;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }


        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: var(--glass-bg);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(8,15,30,0.45);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(6px) saturate(120%);
        }

        .header {
            background: transparent;
            color: #fff;
            padding: 28px 30px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header h1 {
            font-size: 1.6rem;
            margin: 0;
            font-weight: 700;
            color: rgb(95, 116, 182);
            letter-spacing: 0.2px;
        }

        .header p {
            font-size: 0.95rem;
            margin: 0;
            opacity: 0.95;
            color: #a337e2;
        }

        .search-section {
            padding: 22px 30px;
            background: transparent;
            border-bottom: 1px solid rgba(18,24,36,0.06);
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select {
            padding: 12px 14px;
            border: 1px solid rgba(16,22,30,0.08);
            border-radius: 10px;
            font-size: 0.98em;
            transition: box-shadow .18s ease, transform .12s ease;
            background: rgba(255,255,255,0.95);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: transform .12s ease, box-shadow .12s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 14px rgba(33,37,41,0.08);
        }

        .btn-primary {
            background: linear-gradient(90deg,var(--accent-1),var(--accent-2));
            color: white;
            border: 0;
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; transform: translateY(-2px); }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; transform: translateY(-2px); }

        .table-section { padding: 22px 30px 30px 30px; overflow-x: auto; }

        .table-container { border-radius: 10px; overflow-x: auto; border: 1px solid rgba(12,18,28,0.06); background: rgba(255,255,255,0.96); position: relative; }

        /* Top scrollbar (small, placed above the table header) */
        .table-scroll-top {
            overflow-x: auto;
            overflow-y: hidden;
            height: 12px;
            margin-bottom: 6px;
        }

        .table-scroll-inner {
            height: 1px;
        }

        table { width: 100%; border-collapse: collapse; background: white; }

        thead { background: linear-gradient(90deg,var(--accent-1),var(--accent-2)); color: white; }
        thead th { padding: 15px; text-align: left; font-weight: 600; text-transform: uppercase; font-size: 0.85em; letter-spacing: 0.5px; }

        tbody tr { border-bottom: 1px solid rgba(12,18,28,0.06); transition: background .12s ease, transform .08s ease; }
        tbody tr:hover { background: rgba(102,126,234,0.04); transform: translateY(-2px); }
        tbody td { padding: 12px 15px; color: #495057; }

        .loading { text-align: center; padding: 40px; font-size: 1.05em; color: var(--muted); }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin: 20px 30px; border: 1px solid #f5c6cb; }
        .no-data { text-align: center; padding: 60px 20px; color: #6c757d; font-size: 1.2em; }

        .pagination { padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; background: transparent; }
        .pagination-info { color: #6c757d; font-size: 0.9em; }
        .pagination-buttons { display: flex; gap: 10px; }

        @media (max-width: 900px) { /* responsive tweaks */ }

        thead th{ position: sticky; top:0; z-index:2; }
        .muted { color: var(--muted); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Dashboard PJS</h1>
            <p>Sistem Pencarian & Monitoring PJS</p>
        </div>

        <div class="search-section">
            <div class="search-grid">
                <div class="form-group">
                    <label for="search">🔍 Pencarian Umum</label>
                    <input type="text" id="search" placeholder="Cari No PJS, Departemen, Barang...">
                </div>

                <div class="form-group">
                    <label for="keyword1">🔑 Keyword 1</label>
                    <input type="text" id="keyword1" placeholder="Departemen, Nama Barang...">
                </div>

                <div class="form-group">
                    <label for="keyword2">🔑 Keyword 2</label>
                    <input type="text" id="keyword2" placeholder="Ukuran, Keterangan...">
                </div>

                <div class="form-group">
                    <label for="dateFrom">📅 Tanggal Dari</label>
                    <input type="date" id="dateFrom">
                </div>

                <div class="form-group">
                    <label for="dateTo">📅 Tanggal Sampai</label>
                    <input type="date" id="dateTo">
                </div>

                <div class="form-group">
                    <label for="limit">📊 Jumlah Data</label>
                    <select id="limit">
                        <option value="50">50 Data</option>
                        <option value="100" selected>100 Data</option>
                        <option value="200">200 Data</option>
                        <option value="500">500 Data</option>
                        <option value="1000">1000 Data</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="searchData()">🔍 Cari Data</button>
                <button class="btn btn-secondary" onclick="resetFilters()">🔄 Reset Filter</button>
                <button class="btn btn-success" onclick="exportToExcel()">📥 Export Excel</button>
            </div>
        </div>

        <div class="table-section">
            <div id="loadingMessage" class="loading" style="display:none;">⏳ Memuat data...</div>
            <div id="errorMessage" class="error" style="display:none;"></div>

            <div id="tableContainer" style="display:none;">
                <!-- top scrollbar to allow horizontal scrolling while keeping header sticky -->
                <div id="tableScrollTop" class="table-scroll-top" style="display:none;">
                    <div id="tableScrollInner" class="table-scroll-inner"></div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>No PJS</th>
                                <th>Tanggal</th>
                                <th>Kode Bahan</th>
                                <th>Departemen</th>
                                <th>Nama Barang</th>
                                <th>Tgl Pakai</th>
                                <th>Ukuran</th>
                                <th>Jumlah</th>
                                <th>User Ditujukan</th>
                                <th>Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="noDataMessage" class="no-data" style="display:none;">📭 Tidak ada data yang ditemukan</div>
        </div>
    </div>

    <div class="pagination" id="paginationSection" style="display:none;">
        <div class="pagination-info" id="paginationInfo"></div>
        <div class="pagination-buttons">
            <button id="prevBtn" class="btn btn-secondary" onclick="previousPage()">‹ Sebelumnya</button>
            <button id="nextBtn" class="btn btn-primary" onclick="nextPage()">Berikutnya ›</button>
        </div>
    </div>

    <script>
        // Point to hosted proxy for PJS
        const API_BASE_URL = window.location.origin + '/sparepart/PJS/get_pjs_list.php';
        let currentOffset = 0;
        let currentLimit = 100;
        let totalRecords = 0;

        // Set default dates (dateFrom default to 1 Jan 2020)
        window.onload = function() {
            const today = new Date();
            const defaultFrom = new Date('2020-01-01');
            
            document.getElementById('dateTo').valueAsDate = today;
            document.getElementById('dateFrom').valueAsDate = defaultFrom;
            
            // Trigger search when Enter is pressed in the search inputs
            ['search','keyword1','keyword2'].forEach(id=>{
                const el = document.getElementById(id);
                if(el){ el.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); searchData(); }}); }
            });

            // Auto load data on page load
            searchData();
        };

        function searchData() {
            const search = document.getElementById('search').value;
            const keyword1 = document.getElementById('keyword1').value;
            const keyword2 = document.getElementById('keyword2').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            const limit = document.getElementById('limit').value;

            currentLimit = parseInt(limit);
            currentOffset = 0;

            const params = new URLSearchParams({
                search: search,
                keyword1: keyword1,
                keyword2: keyword2,
                date_from: dateFrom,
                date_to: dateTo,
                limit: currentLimit,
                offset: currentOffset
            });

            fetchData(params);
        }

        function fetchData(params) {
            showLoading();

            fetch(`${API_BASE_URL}?${params}`)
                .then(r => r.json())
                .then(data => {
                    hideLoading();
                    if (data.success) {
                        displayData(data);
                        updatePagination(data.pagination);
                    } else {
                        showError(data.message || 'Error');
                    }
                })
                .catch(err => { hideLoading(); showError('Error: ' + err.message); });
        }

        function displayData(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.data && data.data.length > 0) {
                data.data.forEach((row, i) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                            <td>${currentOffset + i + 1}</td>
                            <td><strong>${row.cNoPJS || '-'}</strong></td>
                            <td>${formatDate(row.dTanggal)}</td>
                            <td><code>${row.cKodeBahan || '-'}</code></td>
                            <td>${row.dept || '-'}</td>
                            <td>${row.nama_barang || '-'}</td>
                            <td>${formatTglPakai(row.cTglPakai)}</td>
                            <td>${row.ukuran || '-'}</td>
                            <td><strong>${row.jumlah_satuan || (formatNumber(row.jumlah) + (row.satuan ? ' ' + row.satuan : ''))}</strong></td>
                            <td>${row.user_ditujukan || ''}</td>
                            <td>${row.cKeterangan || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
                document.getElementById('tableContainer').style.display = 'block';
                document.getElementById('noDataMessage').style.display = 'none';
                // update top scrollbar width and show/hide
                syncTopScrollbar();
            } else {
                document.getElementById('tableContainer').style.display = 'none';
                document.getElementById('noDataMessage').style.display = 'block';
            }
        }

        function syncTopScrollbar() {
            const top = document.getElementById('tableScrollTop');
            const inner = document.getElementById('tableScrollInner');
            const container = document.querySelector('#tableContainer .table-container');
            if (!top || !inner || !container) return;

            // set inner width to table scroll width
            const tbl = container.querySelector('table');
            if (!tbl) { top.style.display = 'none'; return; }

            const scrollWidth = tbl.scrollWidth;
            inner.style.width = scrollWidth + 'px';

            // show top scrollbar only when overflow exists
            if (container.clientWidth < scrollWidth) {
                top.style.display = 'block';
            } else {
                top.style.display = 'none';
            }

            // sync scrolling both ways
            // remove previous handlers to avoid duplicates
            top.onscroll = function() { container.scrollLeft = top.scrollLeft; };
            container.onscroll = function() { top.scrollLeft = container.scrollLeft; };
        }

        // keep synced on window resize
        window.addEventListener('resize', function() { setTimeout(syncTopScrollbar, 120); });

        function updatePagination(pagination) {
            if (!pagination) return;

            totalRecords = pagination.total_records;
            
            const info = `Menampilkan ${currentOffset + 1} - ${Math.min(currentOffset + currentLimit, totalRecords)} dari ${totalRecords} data`;
            document.getElementById('paginationInfo').textContent = info;

            document.getElementById('prevBtn').disabled = !pagination.has_prev;
            document.getElementById('nextBtn').disabled = !pagination.has_next;
            document.getElementById('paginationSection').style.display = 'flex';
        }

        function previousPage() {
            if (currentOffset >= currentLimit) {
                currentOffset -= currentLimit;
                const params = buildSearchParams();
                params.set('offset', currentOffset);
                fetchData(params);
            }
        }

        function nextPage() {
            if (currentOffset + currentLimit < totalRecords) {
                currentOffset += currentLimit;
                const params = buildSearchParams();
                params.set('offset', currentOffset);
                fetchData(params);
            }
        }

        function buildSearchParams() {
            return new URLSearchParams({
                search: document.getElementById('search').value,
                keyword1: document.getElementById('keyword1').value,
                keyword2: document.getElementById('keyword2').value,
                date_from: document.getElementById('dateFrom').value,
                date_to: document.getElementById('dateTo').value,
                limit: currentLimit,
                offset: currentOffset
            });
        }

        function resetFilters() {
            document.getElementById('search').value = '';
            document.getElementById('keyword1').value = '';
            document.getElementById('keyword2').value = '';
            document.getElementById('dateTo').valueAsDate = new Date();
            document.getElementById('dateFrom').valueAsDate = new Date('2020-01-01');
            document.getElementById('limit').value = '100';
            searchData();
        }

        function exportToExcel() {
            const params = buildSearchParams();
            params.set('export', 'excel');
            window.location.href = `${API_BASE_URL}?${params}`;
        }

        function showLoading() { document.getElementById('loadingMessage').style.display = 'block'; document.getElementById('errorMessage').style.display = 'none'; document.getElementById('tableContainer').style.display = 'none'; document.getElementById('noDataMessage').style.display = 'none'; }
        function hideLoading() { document.getElementById('loadingMessage').style.display = 'none'; }
        function showError(msg) { document.getElementById('errorMessage').textContent = msg; document.getElementById('errorMessage').style.display = 'block'; document.getElementById('tableContainer').style.display = 'none'; document.getElementById('noDataMessage').style.display = 'none'; }
        function formatDate(s) { if(!s) return '-'; const d=new Date(s); if(isNaN(d)) return s; return d.toLocaleDateString('id-ID',{year:'numeric',month:'short',day:'numeric'}); }
        function formatNumber(n) { if(n===0) return '0'; if(!n) return '0'; return parseFloat(n).toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:2}); }

        function formatTglPakai(s) {
            if(!s) return '-';
            s = String(s).trim();
            const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

            // dd-mm-yy (e.g., 13-05-26)
            if (/^\d{2}-\d{2}-\d{2}$/.test(s)) {
                const parts = s.split('-');
                const day = parseInt(parts[0],10);
                const monthIdx = parseInt(parts[1],10) - 1;
                const year = 2000 + parseInt(parts[2],10);
                if (!isNaN(day) && monthIdx >= 0 && monthIdx <= 11) return `${day} ${months[monthIdx]} ${year}`;
            }

            // dd-mm-yyyy
            if (/^\d{2}-\d{2}-\d{4}$/.test(s)) {
                const parts = s.split('-');
                const day = parseInt(parts[0],10);
                const monthIdx = parseInt(parts[1],10) - 1;
                const year = parseInt(parts[2],10);
                if (!isNaN(day) && monthIdx >= 0 && monthIdx <= 11) return `${day} ${months[monthIdx]} ${year}`;
            }

            // yyyy-mm-dd or iso
            if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
                const parts = s.split('-');
                const year = parseInt(parts[0],10);
                const monthIdx = parseInt(parts[1],10) - 1;
                const day = parseInt(parts[2].slice(0,2),10);
                if (!isNaN(day) && monthIdx >= 0 && monthIdx <= 11) return `${day} ${months[monthIdx]} ${year}`;
            }

            // dd/mm/yy or dd/mm/yyyy
            if (/^\d{2}\/\d{2}\/\d{2,4}$/.test(s)) {
                const parts = s.split('/');
                const day = parseInt(parts[0],10);
                const monthIdx = parseInt(parts[1],10) - 1;
                let year = parseInt(parts[2],10);
                if (year < 100) year = 2000 + year;
                if (!isNaN(day) && monthIdx >= 0 && monthIdx <= 11) return `${day} ${months[monthIdx]} ${year}`;
            }

            // fallback to Date parsing and locale formatting
            const dt = new Date(s);
            if (!isNaN(dt)) return dt.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});

            return s;
        }
    </script>
</body>
</html>
