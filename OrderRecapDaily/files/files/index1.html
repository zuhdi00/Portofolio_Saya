<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recap Order Harian</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #eef2f7;
            color: #333;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, #1a4f8a 0%, #2d7dd2 100%);
            color: #fff;
            border-radius: 12px;
            padding: 24px 32px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .3px; }
        .header .subtitle { font-size: .85rem; opacity: .85; margin-top: 4px; }
        .last-update { font-size: .8rem; opacity: .75; }

        /* ── Summary Cards ── */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 18px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            border-left: 4px solid #2d7dd2;
        }
        .card.green  { border-left-color: #28a745; }
        .card.orange { border-left-color: #fd7e14; }
        .card.purple { border-left-color: #6f42c1; }
        .card-label { font-size: .75rem; text-transform: uppercase; color: #888; letter-spacing: .5px; margin-bottom: 6px; }
        .card-value { font-size: 1.5rem; font-weight: 700; color: #1a4f8a; }
        .card.green  .card-value { color: #1e7e34; }
        .card.orange .card-value { color: #c85e00; }
        .card.purple .card-value { color: #4e2c9e; }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .toolbar h2 { font-size: 1.1rem; font-weight: 600; color: #1a4f8a; }
        .btn-group { display: flex; gap: 8px; }
        button {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: .85rem;
            font-weight: 600;
            transition: background .2s, transform .1s;
        }
        button:active { transform: scale(.97); }
        .btn-refresh { background: #2d7dd2; color: #fff; }
        .btn-refresh:hover { background: #1a5da8; }
        .btn-export { background: #28a745; color: #fff; }
        .btn-export:hover { background: #1e7e34; }

        /* ── Table ── */
        .table-wrapper {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .88rem;
        }
        thead tr { background: #1a4f8a; color: #fff; }
        thead th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }
        thead th.right { text-align: right; }
        tbody tr { border-bottom: 1px solid #eee; transition: background .15s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #f0f6ff; }
        tbody td { padding: 11px 14px; white-space: nowrap; }
        tbody td.right { text-align: right; font-variant-numeric: tabular-nums; }
        tbody td.neg { color: #c0392b; font-weight: 600; }
        tbody td.pos { color: #1e7e34; font-weight: 600; }

        /* ── Footer row ── */
        tfoot tr { background: #e9f0fb; font-weight: 700; }
        tfoot td { padding: 12px 14px; border-top: 2px solid #2d7dd2; }
        tfoot td.right { text-align: right; }

        /* ── State messages ── */
        .state-row td {
            text-align: center;
            padding: 32px;
            color: #888;
            font-style: italic;
        }
        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 3px solid #ccc;
            border-top-color: #2d7dd2;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: .75rem;
            font-weight: 600;
        }
        .badge-neg { background: #fde8e8; color: #c0392b; }
        .badge-pos { background: #e8f8ee; color: #1e7e34; }

        /* ── Error banner ── */
        .error-banner {
            background: #fde8e8;
            border: 1px solid #f5c6cb;
            color: #721c24;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 600px) {
            .header { padding: 18px 20px; }
            .header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="header">
        <div>
            <h1>📦 Recap Order Harian</h1>
            <div class="subtitle">Rekap order vs kuota harian — 30 hari terakhir</div>
        </div>
        <div class="last-update" id="lastUpdate">Belum diperbarui</div>
    </div>

    <!-- Error banner -->
    <div class="error-banner" id="errorBanner"></div>

    <!-- Summary Cards -->
    <div class="summary-grid">
        <div class="card">
            <div class="card-label">Kuota Harian</div>
            <div class="card-value" id="cardKuota">—</div>
        </div>
        <div class="card green">
            <div class="card-label">Total Order (30 hr)</div>
            <div class="card-value" id="cardTotalOrder">—</div>
        </div>
        <div class="card orange">
            <div class="card-label">Jumlah Hari</div>
            <div class="card-value" id="cardJumlahHari">—</div>
        </div>
        <div class="card purple">
            <div class="card-label">Total Akhir Kumulatif</div>
            <div class="card-value" id="cardTotalAkhir">—</div>
        </div>
    </div>

    <!-- Table -->
    <div class="toolbar">
        <h2>Detail Harian</h2>
        <div class="btn-group">
            <button class="btn-refresh" onclick="fetchData()">
                🔄 Refresh
            </button>
            <button class="btn-export" onclick="exportCSV()">
                ⬇ Export CSV
            </button>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="mainTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Tanggal</th>
                    <th class="right">Kuota (Ton)</th>
                    <th class="right">Total Order (Ton)</th>
                    <th class="right">Penambahan Order</th>
                    <th class="right">Total Akhir (Ton)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr class="state-row"><td colspan="6"><span class="spinner"></span>Memuat data…</td></tr>
            </tbody>
            <tfoot id="tableFoot" style="display:none">
                <tr>
                    <td colspan="2"><strong>Grand Total</strong></td>
                    <td class="right">—</td>
                    <td class="right" id="footTotalOrder">—</td>
                    <td class="right">—</td>
                    <td class="right" id="footTotalAkhir">—</td>
                </tr>
            </tfoot>
        </table>
    </div>

</div>

<script>
    let cachedData = [];

    async function fetchData() {
        const tbody = document.getElementById('tableBody');
        const foot  = document.getElementById('tableFoot');
        const errBanner = document.getElementById('errorBanner');

        tbody.innerHTML = '<tr class="state-row"><td colspan="6"><span class="spinner"></span>Memuat data…</td></tr>';
        foot.style.display = 'none';
        errBanner.style.display = 'none';

        try {
            const res  = await fetch('recap_order_harian.php');
            const json = await res.json();

            if (!json.success) throw new Error(json.message || 'Gagal mengambil data.');

            cachedData = json.data || [];
            renderTable(cachedData, json);

            // Summary cards
            document.getElementById('cardKuota').textContent      = json.kuota_ton      || '—';
            document.getElementById('cardTotalOrder').textContent  = json.grand_total_order || '—';
            document.getElementById('cardJumlahHari').textContent  = cachedData.length + ' hari';

            const lastRow = cachedData[cachedData.length - 1];
            document.getElementById('cardTotalAkhir').textContent = lastRow ? lastRow.total_akhir_ton : '—';

            document.getElementById('lastUpdate').textContent = 'Diperbarui: ' + json.timestamp;

        } catch (err) {
            tbody.innerHTML = '<tr class="state-row"><td colspan="6">⚠️ ' + err.message + '</td></tr>';
            errBanner.textContent = 'Error: ' + err.message;
            errBanner.style.display = 'block';
            console.error(err);
        }
    }

    function renderTable(data, json) {
        const tbody = document.getElementById('tableBody');
        const foot  = document.getElementById('tableFoot');

        if (!data.length) {
            tbody.innerHTML = '<tr class="state-row"><td colspan="6">Tidak ada data untuk ditampilkan.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        data.forEach((row, idx) => {
            const penNum = parseFloat(row.penambahan_order);
            const isNeg  = penNum < 0;
            const badge  = isNeg
                ? `<span class="badge badge-neg">${row.penambahan_order}</span>`
                : `<span class="badge badge-pos">${row.penambahan_order}</span>`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${idx + 1}</td>
                <td><strong>${row.tanggal}</strong></td>
                <td class="right">${row.kuota_ton}</td>
                <td class="right">${row.total_order_ton}</td>
                <td class="right">${badge}</td>
                <td class="right">${row.total_akhir_ton}</td>
            `;
            tbody.appendChild(tr);
        });

        // Footer
        document.getElementById('footTotalOrder').textContent = json.grand_total_order || '—';
        const last = data[data.length - 1];
        document.getElementById('footTotalAkhir').textContent = last ? last.total_akhir_ton : '—';
        foot.style.display = '';
    }

    function exportCSV() {
        if (!cachedData.length) { alert('Tidak ada data untuk di-export.'); return; }

        const header = ['No', 'Tanggal', 'Kuota (Ton)', 'Total Order (Ton)', 'Penambahan Order', 'Total Akhir (Ton)'];
        const rows   = cachedData.map((r, i) => [
            i + 1,
            r.tanggal,
            r.kuota_ton,
            r.total_order_ton,
            r.penambahan_order,
            r.total_akhir_ton
        ]);

        const csv    = [header, ...rows].map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
        const blob   = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url    = URL.createObjectURL(blob);
        const a      = document.createElement('a');
        a.href       = url;
        a.download   = 'recap_order_harian_' + new Date().toISOString().slice(0,10) + '.csv';
        a.click();
        URL.revokeObjectURL(url);
    }

    // Auto-refresh setiap 5 menit
    setInterval(fetchData, 5 * 60 * 1000);

    // Load pertama kali
    fetchData();
</script>
</body>
</html>
