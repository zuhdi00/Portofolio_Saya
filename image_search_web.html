<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Design Image Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 50px;
            width: 300px;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .status.success {
            background: #e8f5e8;
            color: #2e7d32;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .image-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .image-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .image-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .image-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .image-card img:hover {
            transform: scale(1.05);
        }

        .image-info {
            margin-top: 10px;
            text-align: center;
        }

        .image-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .image-size {
            color: #666;
            font-size: 0.9em;
        }

        /* Modal untuk preview gambar */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .close:hover {
            opacity: 0.7;
        }

        .network-info {
            background: rgba(102, 126, 234, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }

        .network-info h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .network-info p {
            color: #666;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            input[type="text"] {
                width: 100%;
                margin-bottom: 10px;
            }

            .search-box {
                flex-direction: column;
            }

            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Master Design Image Viewer</h1>
        
        <div class="network-info">
            <h3>📡 Network Information</h3>
            <p><strong>Server:</strong> http://180.251.120.19:8081/</p>
            <p><strong>Network Path:</strong> \\192.168.0.204\Master Design</p>
            <p><strong>Local XAMPP:</strong> Pastikan network drive sudah di-mount dan XAMPP berjalan</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Masukkan nama file gambar (tanpa ekstensi)..." />
            <button onclick="searchImages()">🔍 Cari Gambar</button>
            <button onclick="showAllImages()">📁 Tampilkan Semua</button>
        </div>

        <div id="status"></div>
        <div id="imageContainer" class="image-grid"></div>
    </div>

    <!-- Modal untuk preview -->
    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="">
        </div>
    </div>

    <script>
        let allImages = [];

        function setStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = message;
            statusDiv.className = `status ${type}`;
        }

        function clearStatus() {
            document.getElementById('status').innerHTML = '';
            document.getElementById('status').className = '';
        }

        function searchImages() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) {
                setStatus('❌ Masukkan nama file untuk dicari!', 'error');
                return;
            }

            setStatus('🔍 Mencari gambar...', 'loading');
            
            // Simulasi pencarian dengan fetch ke PHP backend
            fetch('search_images.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `search=${encodeURIComponent(searchTerm)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    displayImages(data.images);
                    setStatus(`✅ Ditemukan ${data.images.length} gambar`, 'success');
                } else {
                    setStatus(`❌ ${data.message}`, 'error');
                    document.getElementById('imageContainer').innerHTML = '';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                setStatus('❌ Terjadi kesalahan saat mencari gambar', 'error');
            });
        }

        function showAllImages() {
            setStatus('📂 Memuat semua gambar...', 'loading');
            
            fetch('get_all_images.php')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    allImages = data.images;
                    displayImages(data.images);
                    setStatus(`✅ Menampilkan ${data.images.length} gambar`, 'success');
                } else {
                    setStatus(`❌ ${data.message}`, 'error');
                    document.getElementById('imageContainer').innerHTML = '';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                setStatus('❌ Terjadi kesalahan saat memuat gambar', 'error');
            });
        }

        function displayImages(images) {
            const container = document.getElementById('imageContainer');
            container.innerHTML = '';

            images.forEach((image, index) => {
                const imageCard = document.createElement('div');
                imageCard.className = 'image-card';
                
                imageCard.innerHTML = `
                    <img src="${image.url}" alt="${image.name}" onclick="openModal('${image.url}', '${image.name}')" />
                    <div class="image-info">
                        <div class="image-name">${image.name}</div>
                        <div class="image-size">${image.size || 'Unknown size'}</div>
                    </div>
                `;
                
                container.appendChild(imageCard);
            });

            setTimeout(clearStatus, 3000);
        }

        function openModal(imageSrc, imageName) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            
            modalImage.src = imageSrc;
            modalImage.alt = imageName;
            modal.style.display = 'block';
            
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Event listener untuk keyboard
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && document.activeElement.id === 'searchInput') {
                searchImages();
            }
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // Event listener untuk klik di luar modal
        document.getElementById('imageModal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeModal();
            }
        });

        // Load semua gambar saat halaman dimuat
        window.addEventListener('load', function() {
            showAllImages();
        });
    </script>
</body>
</html>
