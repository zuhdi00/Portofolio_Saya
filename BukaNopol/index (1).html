<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Buka Nopol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --border2:  #21262d;
      --accent:   #f0a500;
      --accent2:  #e05c00;
      --green:    #3fb950;
      --red:      #f85149;
      --yellow:   #e3b341;
      --txt:      #e6edf3;
      --txt2:     #8b949e;
      --mono:     'Share Tech Mono', monospace;
      --sans:     'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(240,165,0,.08) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(48,54,61,.35) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(48,54,61,.35) 40px);
    }

    /* ── HEADER ──────────────────────────────── */
    .header {
      width: 100%;
      max-width: 560px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 36px; height: 36px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .header-icon svg { width: 18px; height: 18px; fill: var(--accent); }
    .header-text h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
    .header-text p  { font-size: 11px; color: var(--txt2); margin-top: 1px; font-family: var(--mono); }

    /* ── CARD ────────────────────────────────── */
    .card {
      width: 100%; max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .card-body { padding: 20px; }

    /* ── INPUT GROUP ─────────────────────────── */
    .field-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--txt2);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field-label::before {
      content: '';
      display: inline-block;
      width: 3px; height: 12px;
      background: var(--accent);
      border-radius: 2px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 14px;
    }
    .input-wrap input {
      width: 100%;
      padding: 12px 48px 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--txt);
      font-family: var(--mono);
      font-size: 16px;
      letter-spacing: .1em;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap input::placeholder { color: var(--border); }
    .input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(240,165,0,.12);
    }
    .input-clear {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--txt2);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: color .15s;
      display: none;
    }
    .input-clear:hover { color: var(--txt); }
    .input-clear svg { width: 16px; height: 16px; }

    /* ── BUTTONS ─────────────────────────────── */
    .btn-row { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      padding: 11px 14px;
      border-radius: 7px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s, border-color .15s, opacity .15s, transform .08s;
      user-select: none;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    .btn-primary {
      background: var(--accent);
      color: #0d1117;
      border-color: var(--accent);
    }
    .btn-primary:not(:disabled):hover { background: #fdb72a; border-color: #fdb72a; }

    .btn-open {
      background: transparent;
      color: var(--green);
      border-color: var(--green);
    }
    .btn-open:not(:disabled):hover { background: rgba(63,185,80,.1); }

    .btn-undo {
      background: transparent;
      color: #a78bfa;
      border-color: #a78bfa;
    }
    .btn-undo:not(:disabled):hover { background: rgba(167,139,250,.1); }

    .btn-ghost {
      background: transparent;
      color: var(--txt2);
      border-color: var(--border);
    }
    .btn-ghost:not(:disabled):hover { color: var(--txt); border-color: var(--txt2); }

    /* ── SPINNER ─────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .7s linear infinite; display: inline-block; }

    /* ── DIVIDER ─────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border2);
      margin: 18px 0;
    }

    /* ── STATUS BADGE ────────────────────────── */
    .status-bar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 7px;
      border: 1px solid;
      font-size: 13px;
      font-weight: 500;
      margin-top: 14px;
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .status-bar.show { display: flex; }
    .status-bar svg { width: 16px; height: 16px; flex-shrink: 0; }

    .status-bar.ok     { background: rgba(63,185,80,.08);   border-color: rgba(63,185,80,.3);   color: #3fb950; }
    .status-bar.warn   { background: rgba(227,179,65,.08);  border-color: rgba(227,179,65,.3);  color: #e3b341; }
    .status-bar.err    { background: rgba(248,81,73,.08);   border-color: rgba(248,81,73,.3);   color: #f85149; }
    .status-bar.info   { background: rgba(240,165,0,.08);   border-color: rgba(240,165,0,.3);   color: #f0a500; }
    .status-bar.loading { background: rgba(139,148,158,.06); border-color: var(--border);       color: var(--txt2); }

    /* ── DATA TABLE ──────────────────────────── */
    .result-panel {
      display: none;
      margin-top: 18px;
      animation: fadeIn .3s ease;
    }
    .result-panel.show { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .result-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--txt2);
    }
    .result-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--txt2);
      background: var(--bg);
      border: 1px solid var(--border2);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .table-wrap {
      border: 1px solid var(--border2);
      border-radius: 7px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    thead th {
      background: rgba(30,36,44,.8);
      color: var(--txt2);
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 8px 12px;
      text-align: left;
      font-size: 10px;
      border-bottom: 1px solid var(--border2);
    }
    tbody tr {
      border-bottom: 1px solid var(--border2);
      transition: background .12s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,.02); }
    tbody td {
      padding: 9px 12px;
      font-family: var(--mono);
      color: var(--txt);
      vertical-align: middle;
    }
    tbody td.nama {
      font-family: var(--sans);
      font-size: 12px;
      color: var(--txt2);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Status pill */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--sans);
      letter-spacing: .04em;
    }
    .pill::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .pill-open   { background: rgba(63,185,80,.12);  color: #3fb950; }
    .pill-open::before  { background: #3fb950; }
    .pill-closed { background: rgba(248,81,73,.12);  color: #f85149; }
    .pill-closed::before { background: #f85149; }

    /* ── FOOTER ──────────────────────────────── */
    .card-footer {
      padding: 10px 20px;
      border-top: 1px solid var(--border2);
      background: rgba(255,255,255,.01);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-info {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--border);
    }
    .db-status {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--txt2);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .db-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
    </div>
    <div class="header-text">
    <h1>Buka Nopol</h1>
      <p>Fitur Buka Nopol dari Departemen EDP</p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">

      <div class="field-label">Nomor Polisi Kendaraan</div>

      <div class="input-wrap">
        <input id="nopol" type="text" placeholder="AG-8835-UO" autocomplete="off" spellcheck="false">
        <button class="input-clear" id="clrInput" title="Hapus" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="checkBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Cek Nopol
        </button>
        <button class="btn btn-open" id="openBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
          Buka
        </button>
        <button class="btn btn-undo" id="undoBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
          Undo
        </button>
        <button class="btn btn-ghost" id="clrBtn" style="flex:0 0 auto; padding: 11px 14px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.02"/></svg>
        </button>
      </div>

      <div class="status-bar" id="statusBar">
        <svg id="statusIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="statusMsg"></span>
      </div>

      <div class="result-panel" id="resultPanel">
        <div class="divider"></div>
        <div class="result-header">
          <span class="result-title">Entri Ditemukan</span>
          <span class="result-count" id="resultCount">0 baris</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>No. SRJ</th>
                <th>Tanggal</th>
                <th>Nama</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

    </div>

    <div class="card-footer">
      <span class="footer-info">PT.Supracor Sejahtera</span>
      <span class="db-status"><span class="db-dot"></span>Connected</span>
    </div>
  </div>

<script>
  const nopolEl   = document.getElementById('nopol');
  const checkBtn  = document.getElementById('checkBtn');
  const openBtn   = document.getElementById('openBtn');
  const undoBtn   = document.getElementById('undoBtn');
  const clrBtn    = document.getElementById('clrBtn');
  const clrInput  = document.getElementById('clrInput');
  const statusBar = document.getElementById('statusBar');
  const statusMsg = document.getElementById('statusMsg');
  const statusIcon= document.getElementById('statusIcon');
  const resultPanel = document.getElementById('resultPanel');
  const tableBody   = document.getElementById('tableBody');
  const resultCount = document.getElementById('resultCount');

  // Snapshot per nopol: { [nopol]: [{cNoSRJ, cSrjBlk}, ...] }
  // Disimpan di memori sesi (hilang saat refresh)
  const undoSnapshots = {};

  // Icons SVG paths
  const icons = {
    ok:      '<circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/>',
    warn:    '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    err:     '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
    info:    '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
    loading: '<path d="M21 12a9 9 0 1 1-6.22-8.56"/>'
  };

  function showStatus(type, msg) {
    statusBar.className = 'status-bar show ' + type;
    statusIcon.innerHTML = icons[type] || '';
    if (type === 'loading') statusIcon.innerHTML = '<path class="spin" d="M21 12a9 9 0 1 1-6.22-8.56"/>';
    statusMsg.textContent = msg;
    if (type === 'loading') {
      statusIcon.querySelector('path')?.classList.add('spin');
    }
  }

  function hideStatus() {
    statusBar.className = 'status-bar';
  }

  function showTable(rows) {
    tableBody.innerHTML = '';
    const EXCLUDED = ['1', '3', '4'];
    const visible = rows.filter(r => !EXCLUDED.includes(String(r.cSrjBlk)));
    visible.forEach(r => {
      const isOpen = r.cSrjBlk === '3';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escHtml(r.cNoSRJ ?? '—')}</td>
        <td>${escHtml(r.dTanggal ?? '—')}</td>
        <td class="nama" title="${escHtml(r.cNama ?? '')}">${escHtml(r.cNama ?? '—')}</td>
        <td>
          <span class="pill ${isOpen ? 'pill-open' : 'pill-closed'}">
            ${isOpen ? 'BUKA (3)' : 'TUTUP (' + escHtml(r.cSrjBlk || '-') + ')'}
          </span>
        </td>
      `;
      tableBody.appendChild(tr);
    });
    resultCount.textContent = visible.length + ' baris';
    resultPanel.classList.add('show');
  }

  function hideTable() {
    resultPanel.classList.remove('show');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function syncUndoBtn(nopol) {
    undoBtn.disabled = !undoSnapshots[nopol];
  }

  // Auto uppercase
  nopolEl.addEventListener('input', () => {
    const pos = nopolEl.selectionStart;
    nopolEl.value = nopolEl.value.toUpperCase();
    nopolEl.setSelectionRange(pos, pos);
    clrInput.style.display = nopolEl.value ? 'block' : 'none';
    // Sync tombol undo sesuai nopol yg sedang diketik
    syncUndoBtn(nopolEl.value.trim());
  });
  nopolEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') checkBtn.click();
  });

  clrInput.addEventListener('click', reset);
  clrBtn.addEventListener('click', reset);

  function reset() {
    nopolEl.value = '';
    clrInput.style.display = 'none';
    openBtn.disabled = true;
    undoBtn.disabled = true;
    hideStatus();
    hideTable();
    nopolEl.focus();
  }

  async function apiCall(params) {
    const fd = new URLSearchParams(params);
    const res = await fetch('buka_nopol_action.php', { method: 'POST', body: fd });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  checkBtn.addEventListener('click', async () => {
    const n = nopolEl.value.trim();
    if (!n) { showStatus('err', 'Masukkan No. Polisi terlebih dahulu.'); nopolEl.focus(); return; }
    checkBtn.disabled = true;
    openBtn.disabled  = true;
    hideTable();
    showStatus('loading', 'Memeriksa nomor polisi…');
    try {
      const j = await apiCall({ nopol: n });
      if (!j.success) {
        showStatus('err', j.message || 'Terjadi kesalahan pada server.');
      } else if (!j.found) {
        showStatus('err', `Nomor polisi "${n}" tidak ditemukan di tbSRJ.`);
        hideTable();
      } else {
        showTable(j.rows || []);
        if (j.overallStatus === 'open') {
          showStatus('ok', `Semua ${j.totalRows} entri sudah BUKA (cSrjBlk = '3').`);
          openBtn.disabled = true;
        } else {
          const tutupCount = (j.rows || []).filter(r => !['1','3','4'].includes(String(r.cSrjBlk))).length;
          showStatus('warn', `Ditemukan ${tutupCount} entri bisa dibuka. Klik Buka untuk mengubah cSrjBlk → '3'.`);
          openBtn.disabled = false;
        }
      }
    } catch (e) {
      showStatus('err', 'Koneksi gagal: ' + e.message);
    }
    checkBtn.disabled = false;
    syncUndoBtn(n);
  });

  openBtn.addEventListener('click', async () => {
    const n = nopolEl.value.trim();
    if (!n) return;
    const tutupRows = Array.from(tableBody.querySelectorAll('tr')).filter(r => r.querySelector('.pill-closed'));
    if (!confirm(`Buka semua entri TUTUP untuk NoPol "${n}" (set cSrjBlk = '3')?\nJumlah baris: ${tutupRows.length}`)) return;
    openBtn.disabled  = true;
    checkBtn.disabled = true;
    showStatus('loading', 'Memproses buka nopol…');
    try {
      const j = await apiCall({ nopol: n, do: 'open' });
      if (j.success) {
        // Simpan snapshot SEBELUM update (rows yang dikembalikan PHP adalah data sebelum update)
        if (j.rows && j.rows.length > 0) {
          undoSnapshots[n] = j.rows.map(r => ({ cNoSRJ: r.cNoSRJ, cSrjBlk: r.cSrjBlk }));
        }
        showStatus('ok', `Berhasil membuka ${j.affected} baris untuk NoPol "${n}" (cSrjBlk → '3'). Klik Undo untuk batalkan.`);
        if (j.rows) {
          const updated = j.rows.map(r => ({ ...r, cSrjBlk: '3' }));
          showTable(updated);
          resultCount.textContent = '0 baris';
        }
        openBtn.disabled = true;
      } else {
        showStatus('err', j.message || 'Gagal melakukan update.');
      }
    } catch (e) {
      showStatus('err', 'Koneksi gagal: ' + e.message);
    }
    checkBtn.disabled = false;
    syncUndoBtn(n);
  });

  undoBtn.addEventListener('click', async () => {
    const n = nopolEl.value.trim();
    if (!n) return;
    const snapshot = undoSnapshots[n];
    if (!snapshot || snapshot.length === 0) {
      showStatus('err', 'Tidak ada data undo untuk NoPol ini di sesi ini.');
      return;
    }
    if (!confirm(`Kembalikan cSrjBlk ke nilai semula untuk NoPol "${n}"?\n(${snapshot.length} baris akan di-restore)`)) return;

    undoBtn.disabled  = true;
    checkBtn.disabled = true;
    openBtn.disabled  = true;
    showStatus('loading', 'Memproses undo…');
    try {
      const j = await apiCall({
        nopol:    n,
        do:       'undo',
        snapshot: JSON.stringify(snapshot)
      });
      if (j.success) {
        // Hapus snapshot setelah berhasil undo agar tidak bisa undo 2x
        delete undoSnapshots[n];
        showStatus('ok', `Undo berhasil — ${j.affected} baris dikembalikan ke nilai semula.`);
        // Refresh tabel dengan data restore
        const restored = snapshot.map(r => ({ ...r }));
        showTable(restored);
        // Aktifkan kembali tombol Buka jika ada yang masih tutup
        const adaTutup = restored.some(r => !['1','3','4'].includes(String(r.cSrjBlk)));
        openBtn.disabled = !adaTutup;
      } else {
        showStatus('err', j.message || 'Gagal melakukan undo.');
        undoBtn.disabled = false;
      }
    } catch (e) {
      showStatus('err', 'Koneksi gagal: ' + e.message);
      undoBtn.disabled = false;
    }
    checkBtn.disabled = false;
    syncUndoBtn(n);
  });
</script>
</body>
</html>
