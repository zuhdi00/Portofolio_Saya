
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  #fu-root{min-height:520px;display:flex;align-items:center;justify-content:center;padding:2rem;position:relative;overflow:hidden;background:#020817;border-radius:12px}
  canvas#bg{position:absolute;inset:0;width:100%;height:100%}
  .panel{position:relative;z-index:2;width:100%;max-width:480px;border:1px solid rgba(0,200,255,0.25);border-radius:10px;background:rgba(2,12,30,0.82);backdrop-filter:blur(12px);padding:2rem;box-shadow:0 0 40px rgba(0,180,255,0.06)}
  .panel::before{content:'';position:absolute;inset:-1px;border-radius:10px;border:1px solid transparent;background:linear-gradient(135deg,rgba(0,200,255,0.4),transparent 60%) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;pointer-events:none}
  .header{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem}
  .dot{width:8px;height:8px;border-radius:50%;background:#00c8ff;box-shadow:0 0 8px #00c8ff;animation:pulse 1.8s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.4s;background:#0066ff}
  .dot:nth-child(3){animation-delay:.8s;background:#6600ff}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  .title{font-family:'Share Tech Mono',monospace;font-size:1.1rem;color:#00c8ff;letter-spacing:.1em;text-shadow:0 0 10px rgba(0,200,255,.5)}
  .sub{font-family:'Share Tech Mono',monospace;font-size:.72rem;color:rgba(0,200,255,.5);margin-bottom:1.25rem;letter-spacing:.05em}
  .field-label{font-family:'Share Tech Mono',monospace;font-size:.7rem;color:rgba(0,200,255,.7);letter-spacing:.15em;margin-bottom:.4rem;display:flex;align-items:center;gap:6px}
  .field-label::before{content:'//';color:rgba(0,200,255,.35)}
  .inp-wrap{position:relative;margin-bottom:1.25rem}
  .inp-wrap input{width:100%;background:rgba(0,200,255,.04);border:1px solid rgba(0,200,255,.2);border-radius:6px;padding:10px 14px;font-family:'Share Tech Mono',monospace;font-size:.9rem;color:#e0f8ff;outline:none;transition:border-color .2s,box-shadow .2s;letter-spacing:.05em}
  .inp-wrap input::placeholder{color:rgba(0,200,255,.3)}
  .inp-wrap input:focus{border-color:rgba(0,200,255,.6);box-shadow:0 0 16px rgba(0,200,255,.12)}
  .scan-line{position:absolute;bottom:-1px;left:0;height:1px;width:0;background:#00c8ff;border-radius:1px;transition:width .3s}
  .inp-wrap input:focus ~ .scan-line{width:100%;box-shadow:0 0 8px #00c8ff}
  .btns{display:flex;gap:10px}
  .btn-ok{flex:1;padding:11px 0;border:1px solid rgba(0,200,255,.5);border-radius:6px;background:rgba(0,200,255,.1);color:#00c8ff;font-family:'Share Tech Mono',monospace;font-size:.85rem;letter-spacing:.12em;cursor:pointer;transition:all .2s;text-transform:uppercase}
  .btn-ok:hover{background:rgba(0,200,255,.18);box-shadow:0 0 18px rgba(0,200,255,.2)}
  .btn-ok:disabled{opacity:.45;cursor:not-allowed}
  .btn-clr{padding:11px 16px;border:1px solid rgba(255,255,255,.1);border-radius:6px;background:transparent;color:rgba(255,255,255,.4);font-family:'Share Tech Mono',monospace;font-size:.85rem;cursor:pointer;transition:all .2s}
  .btn-clr:hover{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.7)}
  #fu-msg{margin-top:1rem;padding:10px 14px;border-radius:6px;font-family:'Share Tech Mono',monospace;font-size:.78rem;letter-spacing:.04em;display:none;border-left:3px solid}
  #fu-msg.ok{display:block;background:rgba(0,255,150,.06);color:#00ff96;border-color:#00ff96}
  #fu-msg.err{display:block;background:rgba(255,50,50,.06);color:#ff6060;border-color:#ff4040}
  .corner{position:absolute;width:14px;height:14px;border-color:rgba(0,200,255,.5)}
  .corner.tl{top:8px;left:8px;border-top:1.5px solid;border-left:1.5px solid}
  .corner.tr{top:8px;right:8px;border-top:1.5px solid;border-right:1.5px solid}
  .corner.bl{bottom:8px;left:8px;border-bottom:1.5px solid;border-left:1.5px solid}
  .corner.br{bottom:8px;right:8px;border-bottom:1.5px solid;border-right:1.5px solid}
  .status-bar{display:flex;justify-content:space-between;margin-bottom:1.4rem;padding-bottom:1rem;border-bottom:1px solid rgba(0,200,255,.1)}
  .status-item{font-family:'Share Tech Mono',monospace;font-size:.65rem;color:rgba(0,200,255,.45);letter-spacing:.08em}
  .status-val{color:rgba(0,200,255,.75)}
</style>

<div id="fu-root">
  <canvas id="bg"></canvas>
  <div class="panel">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="header">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <span class="title">BATAL CLOSE — SLC</span>
    </div>
    <div class="status-bar">
      <span class="status-item">SYS <span class="status-val" id="clk">--:--:--</span></span>
      <span class="status-item">STATUS <span class="status-val">ONLINE</span></span>
      <span class="status-item">MODULE <span class="status-val">STB-v2</span></span>
    </div>
    <p class="sub">// INPUT NO. SLC UNTUK MEMBATALKAN STATUS CLOSE</p>
    <div class="field-label">NO SLC</div>
    <div class="inp-wrap">
      <input id="sc" type="text" placeholder="SLC/2605/00785" autocomplete="off">
      <div class="scan-line"></div>
    </div>
    <div class="btns">
      <button class="btn-ok" id="okBtn">[ EXECUTE ]</button>
      <button class="btn-clr" id="clearBtn">CLR</button>
    </div>
    <div id="fu-msg"></div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  const root = document.getElementById('fu-root');
  let W, H, particles=[], lines=[];
  function resize(){
    W = canvas.width = root.offsetWidth;
    H = canvas.height = root.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for(let i=0;i<60;i++) particles.push({
    x: Math.random()*1400, y: Math.random()*600,
    vx: (Math.random()-.5)*.4, vy: (Math.random()-.5)*.4,
    r: Math.random()*1.5+.5, a: Math.random()
  });

  function lerp(a,b,t){return a+(b-a)*t}
  let hLines=[];
  for(let i=0;i<6;i++) hLines.push({y: Math.random()*600, v:(.3+Math.random()*.4)*(Math.random()<.5?1:-1), a:Math.random()*.12+.04});

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#020817';
    ctx.fillRect(0,0,W,H);

    for(let h of hLines){
      h.y += h.v;
      if(h.y<0) h.y=H; if(h.y>H) h.y=0;
      const g = ctx.createLinearGradient(0,h.y,W,h.y);
      g.addColorStop(0,'rgba(0,200,255,0)');
      g.addColorStop(.4,`rgba(0,200,255,${h.a})`);
      g.addColorStop(.6,`rgba(0,200,255,${h.a})`);
      g.addColorStop(1,'rgba(0,200,255,0)');
      ctx.strokeStyle=g; ctx.lineWidth=.7;
      ctx.beginPath(); ctx.moveTo(0,h.y); ctx.lineTo(W,h.y); ctx.stroke();
    }

    for(let p of particles){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(0,180,255,${p.a*.6})`;
      ctx.fill();
    }

    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<90){
          ctx.strokeStyle=`rgba(0,160,255,${(1-d/90)*.12})`;
          ctx.lineWidth=.5;
          ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();

  function tick(){
    const d=new Date();
    document.getElementById('clk').textContent=d.toLocaleTimeString('id-ID',{hour12:false});
  }
  tick(); setInterval(tick,1000);

  const scEl=document.getElementById('sc');
  const okBtn=document.getElementById('okBtn');
  const clrBtn=document.getElementById('clearBtn');
  const msg=document.getElementById('fu-msg');

  function show(type,text){msg.className=type==='ok'?'ok':'err';msg.textContent=(type==='ok'?'> ':'! ')+text;}

  okBtn.addEventListener('click', async()=>{
    const sc=(scEl.value||'').trim();
    if(!sc){show('err','INPUT NO SLC TERLEBIH DAHULU');scEl.focus();return;}
    okBtn.disabled=true;okBtn.textContent='[ PROCESSING… ]';
    try{
      const fd=new URLSearchParams();fd.append('sc',sc);
      const res=await fetch('batal_close_action.php',{method:'POST',body:fd});
      const j=await res.json();
      if(res.ok&&j.success){show('ok',j.message||'BATAL CLOSE BERHASIL');}
      else{show('err',j.message||'HTTP '+res.status);}
    }catch(e){show('err','KONEKSI GAGAL: '+e.message);}
    okBtn.disabled=false;okBtn.textContent='[ EXECUTE ]';
  });

  clrBtn.addEventListener('click',()=>{scEl.value='';scEl.focus();msg.style.display='none';msg.className='';});
})();
</script>
