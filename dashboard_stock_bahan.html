.<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Stock Bahan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { background: #f8f9fa; }
        .dashboard-container { max-width: 98vw; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 2rem; }
        .table-responsive { font-size: 0.95rem; }
        .table thead th { background: #e9ecef; }
        .dashboard-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-title">Dashboard Stock Bahan</div>
        <div class="mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Cari kode bahan, nama, ID, Pos ..." style="max-width:350px; display:inline-block;">
            <button class="btn btn-primary ms-2" onclick="loadData()">Cari</button>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-hover" id="stockTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Kode Bahan</th>
                        <th>Nama Barang</th>
                        <th>Ukuran</th>
                        <th>Saldo Awal</th>
                        <th>Beli</th>
                        <th>Rt Beli</th>
                        <th>Pakai</th>
                        <th>Rt Pakai</th>
                        <th>Jual</th>
                        <th>Adj</th>
                        <th>Saldo</th>
                    </tr>
                </thead>
                <tbody id="stockBody">
                    <tr><td colspan="24" class="text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
    function formatNumber(num) {
        return num == null ? '' : Number(num).toLocaleString('id-ID');
    }
    function formatDate(d) {
        if (!d || d === 'null') return '';
        return d;
    }
    function loadData() {
        const search = document.getElementById('searchInput').value.trim();
        document.getElementById('stockBody').innerHTML = `<tr><td colspan='24' class='text-center'>Loading...</td></tr>`;
        axios.get('api_get_stock_dashboard.php', { params: search ? { search } : {} })
            .then(resp => {
                if (!resp.data || typeof resp.data.success === 'undefined') {
                    document.getElementById('stockBody').innerHTML = `<tr><td colspan='24' class='text-danger'>Gagal load data: Data tidak valid</td></tr>`;
                    return;
                }
                if (!resp.data.success) {
                    document.getElementById('stockBody').innerHTML = `<tr><td colspan='24' class='text-danger'>Gagal load data: ${resp.data.message || 'Tidak diketahui'}</td></tr>`;
                    return;
                }
                const data = resp.data.data;
                if (!data || !data.length) {
                    document.getElementById('stockBody').innerHTML = `<tr><td colspan='24' class='text-center'>Tidak ada data</td></tr>`;
                    return;
                }
                let html = '';
                data.forEach((row, i) => {
                    html += `<tr>
                        <td>${i+1}</td>
                        <td>${row.cKodeBahan||''}</td>
                        <td>${row.nama_barang||''}</td>
                        <td>${row.ukuran||''}</td>
                        <td class='text-end'>${formatNumber(row.saldo_awal)}</td>
                        <td class='text-end'>${formatNumber(row.beli)}</td>
                        <td class='text-end'>${formatNumber(row.rt_beli)}</td>
                        <td class='text-end'>${formatNumber(row.pakai)}</td>
                        <td class='text-end'>${formatNumber(row.rt_pakai)}</td>
                        <td class='text-end'>${formatNumber(row.jual)}</td>
                        <td class='text-end'>${formatNumber(row.adj)}</td>
                        <td class='text-end'>${formatNumber(row.saldo)}</td>
                    </tr>`;
                });
                document.getElementById('stockBody').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('stockBody').innerHTML = `<tr><td colspan='24' class='text-danger'>Gagal load data: ${err.message}</td></tr>`;
            });
    }
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') loadData();
    });
    window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
